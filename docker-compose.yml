services:
  postgres:
    image: postgres:15
    container_name: tirantips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: wiki
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  wikijs:
    image: requarks/wiki:2
    container_name: wikijs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: strongpassword
      DB_NAME: wiki
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  api:
    build: .
    container_name: tirantips-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      # Code is baked into the image; only PERSISTENT DATA is mounted so it
      # survives container recreates on deploy. SQLite (chat_history.db + WAL
      # side-files) lives here. Code is intentionally NOT mounted in prod.
      - ./data:/app/data
      # Model cache (HuggingFace cross-encoder, fastembed). Without this, the
      # ~1-2GB of models re-download into the container's writable layer on
      # every recreate and bloat the disk. Mounting /root/.cache persists them
      # across deploys — downloaded once, reused forever.
      - ./model_cache:/root/.cache
    env_file:
      - .env
    depends_on:
      - wikijs
      - qdrant
  
# ───────────────────────────────────────────────────────────────────────────
# lets nginx reach the API by its service name `api` on port 8000.
# ───────────────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend          
                                   
    container_name: tirantips-frontend
    restart: unless-stopped
    ports:
      - "80:80"                     # public entry point; nginx serves the SPA
                                    #   and proxies /chat, /preferences, etc.
    depends_on:
      - api
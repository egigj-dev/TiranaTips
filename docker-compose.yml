services:
  postgres:
    image: postgres:15
    container_name: tirantips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: wiki
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  wikijs:
    image: requarks/wiki:2
    container_name: wikijs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: strongpassword
      DB_NAME: wiki
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  api:
    build: .
    container_name: tirantips-api
    restart: unless-stopped
    working_dir: /app
    ports:
      # Loopback-only: nginx reaches the API over the docker network by
      # service name, so the host mapping exists purely for local debugging
      # (curl on the VPS). 0.0.0.0 binding exposed uvicorn to internet
      # scanners ("Invalid HTTP request received" log noise) and left
      # /admin/ingest reachable without auth.
      - "127.0.0.1:8001:8000"
    volumes:
      # Code is baked into the image; only PERSISTENT DATA is mounted so it
      # survives container recreates on deploy. SQLite (chat_history.db + WAL
      # side-files) lives here. Code is intentionally NOT mounted in prod.
      - ./data:/app/data
      # Model cache — mount persistent subdirectories so the image-layer
      # Playwright browsers (installed at build time) are NOT shadowed.
      # HuggingFace models, fastembed, and reranker are persisted across
      # recreates; Playwright browsers come from the $(model_cache)/ms-playwright
      # directory if present, or fall through to the image layer.
      - ./model_cache/huggingface:/root/.cache/huggingface
      - ./model_cache/reranker-onnx:/root/.cache/reranker-onnx
      - ./model_cache/ms-playwright:/root/.cache/ms-playwright
    env_file:
      - .env
    depends_on:
      - wikijs
      - qdrant
  
# ───────────────────────────────────────────────────────────────────────────
# lets nginx reach the API by its service name `api` on port 8000.
# ───────────────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time; the build stage never sees the
        # top-level .env, so it must be forwarded explicitly as a build arg.
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    container_name: tirantips-frontend
    restart: unless-stopped
    ports:
      - "80:80"                     # HTTP → redirects to HTTPS
      - "443:443"                   # HTTPS (self-signed cert); nginx serves the SPA
                                    #   and proxies /chat, /preferences, etc.
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

# nginx.conf — serves the built SPA and proxies API traffic to the FastAPI
# container. Lives at /etc/nginx/conf.d/default.conf inside the image.

# The API container is reachable by its compose service name `api` on the
# internal network. Port 8000 is the CONTAINER port (not the host-published
# one), so this works regardless of how the host port is mapped.
upstream api_backend {
    server api:8000;
}

# --- HTTPS server (self-signed cert) ---------------------------------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Reasonable modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cache busting for JS/CSS assets (content-hashed filenames) -------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- No cache for HTML (always fresh) ---------------------------------
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- API + Server-Sent Events ------------------------------------------
    location ~ ^/(chat|history|sessions|summary|feedback|preferences|places|health|admin|city|events|auth) {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # --- SPA ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTP server — redirect to HTTPS ---------------------------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
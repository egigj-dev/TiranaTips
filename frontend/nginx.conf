# nginx.conf — serves the built SPA and proxies API traffic to the FastAPI
# container. Lives at /etc/nginx/conf.d/default.conf inside the image.

# The API container is reachable by its compose service name `api` on the
# internal network. Port 8000 is the CONTAINER port (not the host-published
# one), so this works regardless of how the host port is mapped.
upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API + Server-Sent Events ------------------------------------------
    # One regex block covers every backend route prefix. Anything matching
    # here is proxied to FastAPI; everything else falls through to the SPA
    # block below. /chat/stream matches via the `chat` prefix and inherits
    # the streaming-safe settings.
    location ~ ^/(chat|history|sessions|summary|feedback|preferences|places|health|admin) {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/chat/stream): never buffer the response (tokens must flush as
        # they arrive) and don't time out mid-stream. The backend additionally
        # sends `X-Accel-Buffering: no`, which nginx honors.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # --- SPA ----------------------------------------------------------------
    # Static asset if it exists, otherwise index.html so react-router's
    # client-side routes (/ask, /foryou) survive a hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
